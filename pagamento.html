    <script>
        function finalizarCompra() {

            function areInputsFilled(inputs) {
                for (var i = 0; i < inputs.length; i++) {
                    if (inputs[i].value.trim() === "") {
                        return false;
                    }
                }
                return true;
            }
            console.log("Finalizar compra function called");

            // Check if the required inputs are filled
            var enderecoInputs = document.querySelectorAll('.inputs-pagamento:first-child input');
            var cartaoInputs = document.querySelectorAll('.inputs-pagamento:last-child input');
            if (areInputsFilled(enderecoInputs) && areInputsFilled(cartaoInputs)) {
                var loadingOverlay = document.getElementById('loadingOverlay');
                loadingOverlay.style.visibility = 'visible';

                // Simule um carregamento demorado (você pode substituir isso com o seu próprio código de carregamento)
                setTimeout(function () {
                    loadingOverlay.style.visibility = 'hidden'; window.location.href = "index.html";
                }, 3000); // 3000 milissegundos = 3 segundos (altere conforme necessário)

            } else {
                alert("Por favor, preencha todos os campos obrigatórios.");
            }
        }

        function maskJs(value, pattern) {
            let i = 0;
            let v = value.toString();
            v = v.replace(/\D/g, '');
            return pattern.replace(/#/g, () => v[i++] || '');
        };

        function aplicar(value) {
            const formatado = maskJs(value, '####-####-####-####');
            document.getElementById('cpf').value = formatado;
        }
        var input = document.querySelectorAll('.js-date')[0];

        var dateInputMask = function dateInputMask(elm) {
            elm.addEventListener('keypress', function (e) {
                if (e.keyCode < 47 || e.keyCode > 57) {
                    e.preventDefault();
                }

                var len = elm.value.length;

                // If we're at a particular place, let the user type the slash
                // i.e., 12/12/1212
                if (len !== 1 || len !== 3) {
                    if (e.keyCode == 47) {
                        e.preventDefault();
                    }
                }

                // If they don't add the slash, do it for them...
                if (len === 2) {
                    elm.value += '/';
                }

                // If they don't add the slash, do it for them...
                if (len === 5) {
                    elm.value += '/';
                }
            });
        };

        dateInputMask(input);
    </script>
